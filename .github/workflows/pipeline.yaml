
name: Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:

  # JOB 1: TEST
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Lint HTML & JS
        run: |
          npx htmlhint index.html
          npx eslint@8 script.js --env browser


  # JOB 2: BUILD AND PUSH
  build-and-push:
    needs: test

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        shell: pwsh
        run: |
          $imageName = "ghcr.io/${{ github.repository }}".ToLowerInvariant()
          "IMAGE_NAME=$imageName" >> $env:GITHUB_ENV

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


  # JOB 3: DEPLOY
  deploy:
    needs: build-and-push

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Set image name
        shell: pwsh
        run: |
          $imageName = "ghcr.io/${{ github.repository }}".ToLowerInvariant()
          "IMAGE_NAME=$imageName" >> $env:GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy container
        shell: pwsh
        run: |
          $image = "$($env:IMAGE_NAME):latest"

          $existing = docker ps -aq --filter "name=web-app"

          if ($existing) {
            docker rm -f web-app

            if ($LASTEXITCODE -ne 0) {
              throw "Gagal menghapus container lama."
            }
          }

          docker pull $image

          if ($LASTEXITCODE -ne 0) {
            throw "Gagal mengambil Docker image."
          }

          docker run -d --name web-app -p "${{ secrets.APP_PORT }}:80" $image

          if ($LASTEXITCODE -ne 0) {
            throw "Gagal menjalankan container baru."
          }

      - name: Health check
        shell: pwsh
        run: |
          $url = "http://localhost:${{ secrets.APP_PORT }}"
          $healthy = $false

          for ($i = 1; $i -le 10; $i++) {
            curl.exe -fsS -o NUL $url

            if ($LASTEXITCODE -eq 0) {
              $healthy = $true
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $healthy) {
            docker logs web-app
            throw "Health check gagal."
          }

          Write-Host "Health check berhasil!"
