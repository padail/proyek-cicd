name: Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint HTML & JS
        run: |
          npx htmlhint index.html
          npx eslint@8 script.js --env browser

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        id: repo_name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Lowercase Repository Name
        run: |
          $repo = $env:GITHUB_REPOSITORY.ToLowerInvariant()
          $utf8 = New-Object System.Text.UTF8Encoding -ArgumentList $false
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "IMAGE_NAME=$repo`n", $utf8)

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy container
        env:
          APP_PORT: ${{ secrets.APP_PORT }}
        run: |
          docker rm -f web-app 2>$null

          $image = "ghcr.io/$($env:IMAGE_NAME):latest"

          docker pull $image
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          docker run -d --name web-app -p "$($env:APP_PORT):80" $image
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Health check
        env:
          APP_PORT: ${{ secrets.APP_PORT }}
        run: |
          Start-Sleep -Seconds 3

          curl.exe -f "http://localhost:$($env:APP_PORT)"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
